name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    paths-ignore: ["**.md", "docs/**", ".github/**", "LICENSE"]

jobs:
  commitlint:
    if: ${{ ! contains(github.event.pull_request.labels.*.name, 'dependencies') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install commitlint
        run: npm install -D @commitlint/cli @commitlint/config-conventional
      - name: Validate PR commits with commitlint
        run: |
          # Copilot may create empty planning commits; validate only commits that change files.
          git rev-list --reverse ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | while read -r commit; do
            if git diff-tree --quiet --no-commit-id -r "$commit"; then
              echo "Skipping empty commit $commit."
              continue
            fi
            npx commitlint --from "$commit^" --to "$commit" --verbose
          done

  build_and_test:
    needs: commitlint
    if: |
      always() && 
      (needs.commitlint.result == 'skipped' || needs.commitlint.result == 'success')
    name: 🛠️ Build and 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: false

      - name: build and test
        run: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:CoverletOutput=coverage/lcov.info --configuration Release

      - name: Coveralls UnitTests
        uses: coverallsapp/github-action@v2.3.8
        with:
          path-to-lcov: test/dotnet-test-rerun.UnitTests/coverage/lcov.info
          flag-name: UnitTests

      - name: Coveralls IntegrationTests
        uses: coverallsapp/github-action@v2.3.8
        with:
          path-to-lcov: test/dotnet-test-rerun.IntegrationTests/coverage/lcov.info
          flag-name: IntegrationTests