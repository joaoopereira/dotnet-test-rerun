name: CD
run-name: CD - ${{ github.event.release.tag_name }}

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: 🛠️ Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: false

      - name: Build
        run: dotnet build --configuration Release

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: test
        run: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:CoverletOutput=coverage/lcov.info --configuration Release

      - name: Coveralls UnitTests
        uses: coverallsapp/github-action@v2.3.8
        with:
          path-to-lcov: test/dotnet-test-rerun.UnitTests/coverage/lcov.info
          flag-name: UnitTests
          parallel: true

      - name: Coveralls IntegrationTests
        uses: coverallsapp/github-action@v2.3.8
        with:
          path-to-lcov: test/dotnet-test-rerun.IntegrationTests/coverage/lcov.info
          flag-name: IntegrationTests
          parallel: true

      # Two reports go to one Coveralls build, so it must be parallel and closed explicitly.
      - name: Coveralls finished
        uses: coverallsapp/github-action@v2.3.8
        with:
          parallel-finished: true

  nuget:
    name: 📦 Pack and Push nuget
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Get version
        uses: kzrnm/get-net-sdk-project-versions-action@v3
        id: get-version
        with:
          proj-path: src/dotnet-test-rerun.csproj

      - name: pack
        run: dotnet pack --configuration Release

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: joaoopereira

      - name: push
        run: dotnet nuget push src/nupkg/dotnet-test-rerun.${{steps.get-version.outputs.version}}.nupkg --source https://api.nuget.org/v3/index.json --api-key $NUGET_API_KEY --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  docker:
    runs-on: ubuntu-latest
    name: 🐋 Build and Push Docker Image
    needs: test
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Get version
        uses: kzrnm/get-net-sdk-project-versions-action@v3
        id: get-version
        with:
          proj-path: src/dotnet-test-rerun.csproj

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7     
        with:
          push: true
        env:
          VERSION: ${{ steps.get-version.outputs.version }}

  action-tag:
    name: 🏷️ Move the major tag of the GitHub Action
    runs-on: ubuntu-latest
    needs: nuget
    # Prereleases keep the major tag on the last stable release.
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Move vMAJOR to this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"

  azure-devops:
    name: 📦 Publish the Azure DevOps extension
    runs-on: ubuntu-latest
    needs: nuget
    # Off until the publisher and its token are set: repository variable AZURE_DEVOPS_PUBLISHER, secret AZURE_DEVOPS_TOKEN.
    if: github.event_name == 'release' && !github.event.release.prerelease && vars.AZURE_DEVOPS_PUBLISHER != ''
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install task dependencies
        working-directory: azure-devops/TestRerunV1
        run: npm ci --omit=dev

      # Agents cache tasks by version, so every publish needs a higher task version; the run number always grows.
      - name: Set versions
        working-directory: azure-devops
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          jq --argjson patch "${{ github.run_number }}" '.version.Patch = $patch' TestRerunV1/task.json > task.tmp && mv task.tmp TestRerunV1/task.json
          jq --arg v "${TAG#v}" '.version = $v' vss-extension.json > ext.tmp && mv ext.tmp vss-extension.json

      - name: Publish
        working-directory: azure-devops
        env:
          PUBLISHER: ${{ vars.AZURE_DEVOPS_PUBLISHER }}
          TOKEN: ${{ secrets.AZURE_DEVOPS_TOKEN }}
        run: npx -y tfx-cli@0.24.2 extension publish --manifest-globs vss-extension.json --publisher "$PUBLISHER" --token "$TOKEN" --no-prompt
